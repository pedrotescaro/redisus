# Canonical label catalog for repository governance.
# Sync manually in GitHub settings or with a label-sync action/tool.

- name: "P0"
  color: "b60205"
  description: "Critical risk, security, data governance, or broken main workflow."
- name: "P1"
  color: "d93f0b"
  description: "High priority work needed before a pilot or public release."
- name: "P2"
  color: "fbca04"
  description: "Important improvement that can follow the stabilization track."
- name: "P3"
  color: "0e8a16"
  description: "Nice-to-have or deferred improvement."

- name: "type:bug"
  color: "d73a4a"
  description: "Incorrect behavior or regression."
- name: "type:chore"
  color: "cfd3d7"
  description: "Maintenance without user-facing behavior change."
- name: "type:refactor"
  color: "5319e7"
  description: "Internal restructuring with preserved behavior."
- name: "type:docs"
  color: "0075ca"
  description: "Documentation, research notes, or developer guidance."
- name: "type:test"
  color: "1d76db"
  description: "Unit, integration, smoke, contract, or coverage work."
- name: "type:security"
  color: "b60205"
  description: "Security hardening, dependency risk, secrets, or LGPD controls."
- name: "type:ci"
  color: "0052cc"
  description: "GitHub Actions, release automation, or repository automation."
- name: "type:feature"
  color: "a2eeef"
  description: "New capability or product behavior."
- name: "type:architecture"
  color: "7057ff"
  description: "Architecture decisions, module boundaries, or system design."

- name: "area:architecture"
  color: "5319e7"
  description: "Architecture, modularity, entrypoints, or system boundaries."
- name: "area:backend"
  color: "0e8a16"
  description: "Backend, API, database, or domain services."
- name: "area:frontend"
  color: "1d76db"
  description: "Web frontend and user interface."
- name: "area:fhir"
  color: "fbca04"
  description: "FHIR R4, RNDS/SUS Digital, terminology, or interoperability."
- name: "area:ml"
  color: "ff7619"
  description: "Models, inference, training, registry, or evaluation."
- name: "area:data"
  color: "006b75"
  description: "Datasets, data lineage, clinical data policy, or artifacts."
- name: "area:docs"
  color: "0075ca"
  description: "Project documentation, setup, operations, or roadmap."
- name: "area:devops"
  color: "0052cc"
  description: "CI/CD, release, environments, reproducibility, or automation."
- name: "area:security"
  color: "b60205"
  description: "Security, privacy, secrets, auth, or repository policy."

- name: "status:blocked"
  color: "000000"
  description: "Blocked by external access, institutional decision, or dependency."
- name: "status:needs-decision"
  color: "d4c5f9"
  description: "Requires maintainer, advisor, clinical, or institutional decision."
- name: "status:ready"
  color: "0e8a16"
  description: "Ready for implementation."
- name: "status:advisory"
  color: "bfd4f2"
  description: "Known technical debt that should not fail CI yet."

