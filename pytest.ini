[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    unit: fast tests for isolated domain and utility behavior
    contract: tests that lock API, FHIR, or inference payload contracts
    fhir: tests for HL7 FHIR R4 payloads and mapping
    smoke: small entrypoint checks suitable for CI
    security: authentication, authorization, and secure-default checks
    e2e: end-to-end workflow tests
    ml: tests that require model, image, or training dependencies
